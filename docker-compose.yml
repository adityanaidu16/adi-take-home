services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kit
      POSTGRES_PASSWORD: kit
      POSTGRES_DB: kit
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kit"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Stands in for Entra ID. Real OIDC: discovery, JWKS, authorization code flow,
  # client credentials. Claims per user come from dev/oauth2/config.json.
  identity:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8090:8080"
    environment:
      JSON_CONFIG_PATH: /app/config.json
    volumes:
      - ./dev/oauth2/config.json:/app/config.json:ro
