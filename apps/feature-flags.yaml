name: Feature Flags
owner: platform-eng
datasource: feature_flags
roles:
  admin: [platform-eng]
view:
  columns: [key, description, environment, enabled]
  visible_to: [admin]
actions:
  - use: toggle_flag
    allowed_roles: [admin]
    approval:
      when: { field: environment, equals: production }
      approver_roles: [admin]
